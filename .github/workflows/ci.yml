name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      # The tests below talk to the real OS power APIs instead of only compiling them.
      - name: Test the keep-awake request
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo test --locked -- --ignored --nocapture

      - name: Test the keep-awake request (D-Bus session)
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: dbus-run-session -- cargo test --locked -- --ignored --nocapture

      - name: Build the app
        working-directory: src-tauri
        run: cargo build --locked

      - name: Launch the app
        if: runner.os == 'macOS'
        run: scripts/smoke-launch.sh src-tauri/target/debug/keepawake-app

      - name: Launch the app (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- scripts/smoke-launch.sh src-tauri/target/debug/keepawake-app

      - name: Launch the app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath src-tauri\target\debug\keepawake-app.exe -PassThru `
            -RedirectStandardOutput app.out.log -RedirectStandardError app.err.log
          $null = $app.Handle  # keeps ExitCode readable after the process ends
          Start-Sleep -Seconds 10
          $exited = $app.HasExited
          if (-not $exited) { Stop-Process -Id $app.Id }
          Get-Content app.out.log, app.err.log
          if ($exited) { throw "KeepAwake exited early with code $($app.ExitCode)" }
          if (Select-String -Path app.err.log -Pattern "panicked" -Quiet) { throw "KeepAwake panicked" }
