name: Release

# Push a tag such as v1.0.0 to build every platform and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files. The app only installs updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KeepAwake ${{ github.ref_name }}
          releaseBody: |
            ## Download

            | System | File |
            |---|---|
            | macOS (Apple Silicon and Intel) | `KeepAwake_*_universal.dmg` |
            | Windows 10/11 | `KeepAwake_*_x64-setup.exe` (recommended) or `.msi` |
            | Linux | `.AppImage` (any distro), `.deb` (Ubuntu/Debian), `.rpm` (Fedora) |

            These builds are not code-signed yet. See the README for the one-time steps to open them:
            https://github.com/kingleykin/keepawake#install

            See [CHANGELOG.md](https://github.com/kingleykin/keepawake/blob/main/CHANGELOG.md) for what changed.
          # Publish only after every platform has uploaded its files.
          releaseDraft: true
          prerelease: false
          # Release builds also make the signed update files. Local builds skip them.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
          # latest.json tells installed copies about this release.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Every platform adds itself to latest.json. Do not publish a release that
      # would leave one of them without updates.
      - name: Check latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern latest.json
          cat latest.json
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' latest.json >/dev/null \
              || { echo "latest.json has no signed update for $platform"; exit 1; }
          done

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
