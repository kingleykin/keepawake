# Keeps dependencies up to date. Security fixes arrive as soon as they are published;
# routine updates are grouped into one pull request per ecosystem each month.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # zbus must stay on the same major version as the keepawake crate,
      # and zbus 6 removed the blocking API that the Linux backend uses.
      - dependency-name: zbus
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
