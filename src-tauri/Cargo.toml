[package]
name = "keepawake-app"
version = "1.1.0"
description = "Keep your computer awake. One click, from the tray."
authors = ["KeepAwake contributors"]
license = "MIT"
repository = "https://github.com/kingleykin/keepawake"
edition = "2021"
rust-version = "1.90"

[lib]
name = "keepawake_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-opener = "2.7.2"
keepawake = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"

strip = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
chrono-tz = { version = "0.10.4", default-features = false }
